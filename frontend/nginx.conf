server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (e.g. the "backend" container on
    # the same Docker/compose network). Override via your orchestrator if named
    # differently.
    location /api/ {
        proxy_pass http://battlebot-backend-catalog.battlebot-backend.svc.cluster.local:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /payment-api/ {
        proxy_pass http://battlebot-backend-payment.battlebot-backend.svc.cluster.local:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
