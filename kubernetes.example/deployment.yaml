apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlebot-backend-catalog
  namespace: battlebot-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: battlebot-backend-catalog
  template:
    metadata:
      labels:
        app: battlebot-backend-catalog
    spec:
      containers:
        - name: battlebot-backend-catalog
          image: ${ACR_NAME}.azurecr.io/battlebot-backend-catalog:0.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: battlebot-backend-catalog-config
            - secretRef:
                name: battlebot-backend-catalog-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
