apiVersion: apps/v1
kind: Deployment
metadata:
  name: battlebot-frontend
  namespace: battlebot-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: battlebot-frontend
  template:
    metadata:
      labels:
        app: battlebot-frontend
    spec:
      containers:
        - name: battlebot-frontend
          image: ${ACR_NAME}.azurecr.io/battlebot-frontend:0.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: battlebot-frontend-maintenance-mode
#          envFrom:
#            - configMapRef:
#                name: battlebot-backend-config
#            - secretRef:
#                name: battlebot-backend-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi